<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>留学航空MBTI - 管理后台</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #1E3A47 0%, #2C5A7A 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }
        .login-container {
            max-width: 400px;
            margin: 80px auto;
            background: white;
            border-radius: 24px;
            padding: 48px 36px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .login-title {
            text-align: center;
            font-size: 28px;
            font-weight: 800;
            color: #1E3A47;
            margin-bottom: 32px;
        }
        .login-title span { font-size: 48px; }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-size: 14px;
            color: #5C4E3A;
            margin-bottom: 8px;
            font-weight: 600;
        }
        .form-group input {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid #E2D9CC;
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.3s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #D4AF37;
            box-shadow: 0 0 0 3px rgba(212,175,55,0.1);
        }
        .login-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #1E3A47, #2B6D93);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
        }
        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }
        .error-msg {
            color: #E53935;
            font-size: 14px;
            margin-top: 8px;
            text-align: center;
            display: none;
        }
        .admin-panel {
            display: none;
            max-width: 1200px;
            margin: 0 auto;
        }
        .admin-header {
            background: white;
            border-radius: 20px;
            padding: 24px 32px;
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        .admin-title {
            font-size: 24px;
            font-weight: 800;
            color: #1E3A47;
        }
        .logout-btn {
            padding: 10px 24px;
            background: #E53935;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }
        .reset-btn {
            padding: 10px 24px;
            background: linear-gradient(135deg, #FF6B6B, #FF4757);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
        }
        .reset-btn:hover {
            background: linear-gradient(135deg, #FF4757, #FF3838);
        }
        .reset-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .reset-modal.show {
            display: flex;
        }
        .reset-modal-content {
            background: white;
            border-radius: 20px;
            padding: 36px;
            max-width: 400px;
            width: 90%;
            text-align: center;
        }
        .reset-modal-title {
            font-size: 22px;
            font-weight: 700;
            color: #E53935;
            margin-bottom: 16px;
        }
        .reset-modal-text {
            color: #666;
            margin-bottom: 20px;
            line-height: 1.6;
        }
        .reset-modal-input {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid #E2D9CC;
            border-radius: 12px;
            font-size: 16px;
            margin-bottom: 16px;
            text-align: center;
        }
        .reset-modal-input:focus {
            outline: none;
            border-color: #FF6B6B;
        }
        .reset-modal-btns {
            display: flex;
            gap: 12px;
        }
        .reset-modal-cancel {
            flex: 1;
            padding: 12px;
            background: #E0E0E0;
            color: #666;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }
        .reset-modal-confirm {
            flex: 1;
            padding: 12px;
            background: linear-gradient(135deg, #FF6B6B, #FF4757);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }
        .reset-modal-confirm:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .reset-error {
            color: #E53935;
            font-size: 13px;
            margin-bottom: 12px;
            display: none;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 24px;
        }
        .stat-card {
            background: white;
            border-radius: 16px;
            padding: 24px;
            text-align: center;
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
        }
        .stat-number {
            font-size: 42px;
            font-weight: 800;
            color: #D4AF37;
        }
        .stat-label {
            font-size: 14px;
            color: #7C6B55;
            margin-top: 8px;
        }
        .section-card {
            background: white;
            border-radius: 20px;
            padding: 28px;
            margin-bottom: 24px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
        }
        .section-title {
            font-size: 20px;
            font-weight: 700;
            color: #1E3A47;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 2px solid #EBDCB8;
        }
        .data-table {
            width: 100%;
            border-collapse: collapse;
        }
        .data-table th, .data-table td {
            padding: 12px 16px;
            text-align: left;
            border-bottom: 1px solid #E2D9CC;
        }
        .data-table th {
            background: #F6F2EA;
            font-weight: 700;
            color: #5C4E3A;
            font-size: 13px;
        }
        .data-table td {
            color: #3E5A6C;
            font-size: 14px;
        }
        .mbti-tag {
            background: #F0E4D2;
            color: #B45F1B;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 12px;
        }
        .refresh-btn {
            padding: 8px 20px;
            background: #D4AF37;
            color: #1A3C32;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            margin-left: 12px;
        }
        .export-btn {
            padding: 10px 24px;
            background: linear-gradient(135deg, #28A745, #20c997);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
        }
        .export-btn:hover {
            background: linear-gradient(135deg, #218838, #1ba97c);
        }
        .export-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .key-user-tag {
            background: linear-gradient(135deg, #FF6B6B, #FF8E53);
            color: white;
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 11px;
        }
        .normal-user-tag {
            background: #E0E0E0;
            color: #666;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
        }
        .delete-btn {
            background: #E53935;
            color: white;
            border: none;
            padding: 5px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
        }
        .delete-btn:hover {
            background: #C62828;
        }
        .key-user-row {
            background: #FFF8F0 !important;
        }
    </style>
</head>
<body>
    <!-- 登录界面 -->
    <div class="login-container" id="loginSection">
        <div class="login-title">
            <span>🛫</span><br>
            留学航空MBTI<br>管理后台
        </div>
        <form id="loginForm">
            <div class="form-group">
                <label>管理员密码</label>
                <input type="password" id="password" placeholder="请输入管理员密码" required>
            </div>
            <button type="submit" class="login-btn">进入后台</button>
        </form>
        <div class="error-msg" id="errorMsg">密码错误，请重试</div>
    </div>

    <!-- 管理面板 -->
    <div class="admin-panel" id="adminPanel">
        <div class="admin-header">
            <div class="admin-title">🛫 留学航空MBTI 管理后台</div>
            <div style="display: flex; gap: 10px;">
                <button class="export-btn" onclick="exportData()">📥 导出Excel</button>
                <button class="reset-btn" onclick="showResetModal()">🔄 重置数据</button>
                <button class="logout-btn" onclick="logout()">退出登录</button>
            </div>
        </div>
        
        <!-- 重置数据确认弹窗 -->
        <div class="reset-modal" id="resetModal">
            <div class="reset-modal-content">
                <div class="reset-modal-title">⚠️ 危险操作</div>
                <div class="reset-modal-text">
                    此操作将清空<b>所有用户</b>和<b>所有测试记录</b>数据！<br><br>
                    此操作<strong>不可恢复</strong>，请谨慎操作。
                </div>
                <div class="reset-error" id="resetError">密码错误，请重试</div>
                <input type="password" class="reset-modal-input" id="resetPassword" placeholder="请输入重置密码" onkeyup="handleResetKeyup(event)">
                <div class="reset-modal-btns">
                    <button class="reset-modal-cancel" onclick="hideResetModal()">取消</button>
                    <button class="reset-modal-confirm" id="resetConfirmBtn" onclick="confirmReset()">确认重置</button>
                </div>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-number" id="totalTests">0</div>
                <div class="stat-label">测试总次数</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="totalUsers">0</div>
                <div class="stat-label">注册用户</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="clickCount">0</div>
                <div class="stat-label">页面点击</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="baobanClicks">0</div>
                <div class="stat-label">报班按钮点击</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="loginCount">0</div>
                <div class="stat-label">登录次数</div>
            </div>
        </div>

        <div class="section-card">
            <div class="section-title">
                📊 MBTI人格分布
                <button class="refresh-btn" onclick="loadStats()">刷新</button>
            </div>
            <div id="mbtiStats"></div>
        </div>

        <div class="section-card">
            <div class="section-title">👥 最近注册用户</div>
            <table class="data-table">
                <thead>
                    <tr>
                        <th>姓名</th>
                        <th>手机号</th>
                        <th>年级</th>
                        <th>注册时间</th>
                        <th>最近登录</th>
                    </tr>
                </thead>
                <tbody id="usersTable"></tbody>
            </table>
        </div>

        <div class="section-card">
            <div class="section-title">📝 测试记录 <span id="resultsCount" style="font-size: 14px; color: #7C6B55; font-weight: normal;"></span></div>
            <table class="data-table">
                <thead>
                    <tr>
                        <th>用户姓名</th>
                        <th>手机号</th>
                        <th>年级</th>
                        <th>用户类型</th>
                        <th>MBTI类型</th>
                        <th>推荐国家</th>
                        <th>提交时间</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="resultsTable"></tbody>
            </table>
        </div>
    </div>

    <script>
        let adminPassword = ''; // 当前会话的管理员密码
        let sessionToken = '';  // 服务端返回的会话token

        // 登录
        document.getElementById('loginForm').onsubmit = async (e) => {
            e.preventDefault();
            const password = document.getElementById('password').value;
            const loginBtn = document.querySelector('.login-btn');
            const errorMsg = document.getElementById('errorMsg');
            
            errorMsg.style.display = 'none';
            loginBtn.disabled = true;
            loginBtn.textContent = '验证中...';

            try {
                const res = await fetch(`${API_BASE}/admin/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });
                const data = await res.json();

                if (data.success) {
                    adminPassword = password;
                    sessionToken = data.token;
                    // 用sessionStorage而非localStorage，关闭标签页即失效
                    sessionStorage.setItem('admin_auth', JSON.stringify({ password, token: data.token }));
                    document.getElementById('loginSection').style.display = 'none';
                    document.getElementById('adminPanel').style.display = 'block';
                    loadStats();
                } else {
                    errorMsg.textContent = data.message || '密码错误，请重试';
                    errorMsg.style.display = 'block';
                    document.getElementById('password').value = '';
                    document.getElementById('password').focus();
                }
            } catch (err) {
                errorMsg.textContent = '连接服务器失败，请确保后端已启动';
                errorMsg.style.display = 'block';
            } finally {
                loginBtn.disabled = false;
                loginBtn.textContent = '进入后台';
            }
        };

        // 加载统计数据
        async function loadStats() {
            try {
                const res = await fetch(`${API_BASE}/admin/stats`, {
                    headers: { 'x-admin-password': adminPassword }
                });
                const data = await res.json();

                if (data.success) {
                    document.getElementById('totalTests').textContent = data.data.totalTests;
                    document.getElementById('totalUsers').textContent = data.data.totalUsers;
                    document.getElementById('clickCount').textContent = data.data.clickCount;
                    document.getElementById('baobanClicks').textContent = data.data.baobanClicks;
                    document.getElementById('loginCount').textContent = data.data.loginCount;

                    // MBTI分布
                    const mbtiStats = document.getElementById('mbtiStats');
                    const dist = data.data.mbtiDistribution;
                    mbtiStats.innerHTML = Object.entries(dist)
                        .sort((a, b) => b[1] - a[1])
                        .map(([mbti, count]) => `
                            <span class="mbti-tag" style="margin: 4px; display: inline-block;">
                                ${mbti}: ${count}人
                            </span>
                        `).join('') || '暂无数据';

                    // 用户列表
                    const usersTable = document.getElementById('usersTable');
                    usersTable.innerHTML = data.data.recentUsers.map(u => `
                        <tr>
                            <td>${u.name}</td>
                            <td>${u.phone}</td>
                            <td>${u.grade}</td>
                            <td>${new Date(u.createdAt).toLocaleDateString()}</td>
                            <td>${u.lastLogin ? new Date(u.lastLogin).toLocaleDateString() : '未登录'}</td>
                        </tr>
                    `).join('') || '<tr><td colspan="5">暂无用户</td></tr>';

                    // 测试结果
                    const resultsTable = document.getElementById('resultsTable');
                    const resultsCount = document.getElementById('resultsCount');
                    const res2 = await fetch(`${API_BASE}/admin/results`, {
                        headers: { 'x-admin-password': adminPassword }
                    });
                    const resultsData = await res2.json();
                    if (resultsData.success && resultsData.results) {
                        const allResults = resultsData.results
                            .sort((a, b) => new Date(b.submittedAt) - new Date(a.submittedAt))
                            .slice(0, 50);
                        
                        resultsCount.textContent = `(共 ${allResults.length} 条)`;
                        resultsTable.innerHTML = allResults.map(r => `
                            <tr class="${r.isKeyUser ? 'key-user-row' : ''}">
                                <td style="font-weight: 600;">${r.userName}</td>
                                <td>${r.userPhone}</td>
                                <td>${r.userGrade}</td>
                                <td>${r.isKeyUser ? '<span class="key-user-tag">⭐ 重点用户</span>' : '<span class="normal-user-tag">普通用户</span>'}</td>
                                <td><span class="mbti-tag">${r.mbti}</span></td>
                                <td>${r.country || '-'}</td>
                                <td>${new Date(r.submittedAt).toLocaleDateString()} ${new Date(r.submittedAt).toLocaleTimeString()}</td>
                                <td><button class="delete-btn" onclick="deleteResult('${r.id}')">删除</button></td>
                            </tr>
                        `).join('') || '<tr><td colspan="8">暂无测试记录</td></tr>';
                    }
                }
            } catch (err) {
                console.error('加载数据失败:', err);
            }
        }
        
        // 删除单条测试记录
        async function deleteResult(id) {
            if (!confirm('确定要删除这条测试记录吗？')) return;
            
            try {
                const res = await fetch(`${API_BASE}/admin/results/${id}`, {
                    method: 'DELETE',
                    headers: { 'x-admin-password': adminPassword }
                });
                const data = await res.json();
                
                if (data.success) {
                    alert('删除成功');
                    loadStats();
                } else {
                    alert('删除失败: ' + (data.message || '未知错误'));
                }
            } catch (err) {
                alert('删除失败，请确保后端服务已启动');
                console.error(err);
            }
        }

        // 导出数据为Excel
        async function exportData() {
            const btn = document.querySelector('.export-btn');
            btn.disabled = true;
            btn.textContent = '导出中...';
            
            try {
                const res = await fetch(`${API_BASE}/admin/export`, {
                    headers: { 'x-admin-password': adminPassword }
                });
                const data = await res.json();
                
                if (data.success) {
                    // 使用安全下载链接（带鉴权）
                    const downloadUrl = `${API_BASE}/admin/download/${encodeURIComponent(data.fileName)}?admin_password=${encodeURIComponent(adminPassword)}`;
                    const link = document.createElement('a');
                    link.href = downloadUrl;
                    link.download = data.fileName;
                    link.click();
                    
                    alert(`导出成功！\n用户数: ${data.stats.usersCount}\n测试记录: ${data.stats.resultsCount}`);
                } else {
                    alert('导出失败: ' + (data.message || '未知错误'));
                }
            } catch (err) {
                alert('导出失败，请确保后端服务已启动');
                console.error(err);
            } finally {
                btn.disabled = false;
                btn.textContent = '📥 导出Excel';
            }
        }
        
        // 显示重置确认弹窗
        function showResetModal() {
            document.getElementById('resetModal').classList.add('show');
            document.getElementById('resetPassword').value = '';
            document.getElementById('resetError').style.display = 'none';
            document.getElementById('resetPassword').focus();
        }
        
        function hideResetModal() {
            document.getElementById('resetModal').classList.remove('show');
        }
        
        function handleResetKeyup(event) {
            if (event.key === 'Enter') {
                confirmReset();
            }
        }
        
        // 确认重置
        async function confirmReset() {
            const password = document.getElementById('resetPassword').value;
            const btn = document.getElementById('resetConfirmBtn');
            
            if (!password) {
                document.getElementById('resetError').textContent = '请输入重置密码';
                document.getElementById('resetError').style.display = 'block';
                return;
            }
            
            btn.disabled = true;
            btn.textContent = '重置中...';
            
            try {
                const res = await fetch(`${API_BASE}/admin/reset`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });
                const data = await res.json();
                
                if (data.success) {
                    alert(data.message);
                    hideResetModal();
                    loadStats();
                } else {
                    document.getElementById('resetError').textContent = data.message || '重置密码错误';
                    document.getElementById('resetError').style.display = 'block';
                }
            } catch (err) {
                alert('重置失败，请确保后端服务已启动');
                console.error(err);
            } finally {
                btn.disabled = false;
                btn.textContent = '确认重置';
            }
        }

        // 退出登录
        function logout() {
            adminPassword = '';
            sessionToken = '';
            sessionStorage.removeItem('admin_auth');
            document.getElementById('loginSection').style.display = 'block';
            document.getElementById('adminPanel').style.display = 'none';
            document.getElementById('password').value = '';
            document.getElementById('password').focus();
        }

        // ===== API 地址配置（自动适配本地/云端）=====
        const API_BASE = window.location.origin.includes('localhost') 
            ? 'http://localhost:3001/api' 
            : window.location.origin + '/api';

        // 检查当前标签页会话是否已登录（仅在标签页未关闭时有效）
        // 每次打开/刷新页面都需要重新验证密码
        (function checkSession() {
            try {
                const saved = sessionStorage.getItem('admin_auth');
                if (saved) {
                    const auth = JSON.parse(saved);
                    // 向服务端验证token是否仍然有效
                    fetch(`${API_BASE}/admin/verify`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ token: auth.token })
                    })
                    .then(res => res.json())
                    .then(data => {
                        if (data.success) {
                            adminPassword = auth.password;
                            sessionToken = auth.token;
                            document.getElementById('loginSection').style.display = 'none';
                            document.getElementById('adminPanel').style.display = 'block';
                            loadStats();
                        } else {
                            // token已失效，清除并显示登录
                            sessionStorage.removeItem('admin_auth');
                        }
                    })
                    .catch(() => {
                        // 服务端不可达，清除旧session
                        sessionStorage.removeItem('admin_auth');
                    });
                }
            } catch(e) {
                sessionStorage.removeItem('admin_auth');
            }
        })();
    </script>
</body>
</html>
